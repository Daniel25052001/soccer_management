services:
  postgres:
    image: postgres:16-alpine
    container_name: goladmin_postgres
    restart: always
    environment:
      POSTGRES_USER: goladmin_user
      POSTGRES_PASSWORD: goladmin_password
      POSTGRES_DB: goladmin_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: goladmin_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: goladmin_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
